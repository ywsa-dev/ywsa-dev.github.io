<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ywsa-dev github page</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Space+Mono:wght@400;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #05050a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
    position: relative;
  }

  /* faint moving grid */
  body::before {
    content: '';
    position: fixed;
    inset: -10%;
    background-image:
      linear-gradient(rgba(120,160,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,160,255,0.06) 1px, transparent 1px);
    background-size: 42px 42px;
    animation: driftGrid 18s linear infinite;
    pointer-events: none;
    z-index: 0;
  }

  /* scanline texture */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(255,255,255,0.02) 2px,
      rgba(255,255,255,0.02) 4px
    );
    pointer-events: none;
    z-index: 2;
  }

  @keyframes driftGrid {
    0% { transform: translate(0, 0); }
    100% { transform: translate(42px, 42px); }
  }

  .glow {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 700px;
    height: 700px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(120,160,255,0.10) 0%, rgba(120,160,255,0) 70%);
    pointer-events: none;
    z-index: 0;
    animation: pulseGlow 6s ease-in-out infinite;
  }

  @keyframes pulseGlow {
    0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
  }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 48px;
    padding: 2rem;
  }

  .text-block {
    text-align: center;
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #headline {
    font-family: 'Space Mono', monospace;
    font-size: clamp(1.2rem, 4vw, 2rem);
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #fff;
    text-shadow: 0 0 18px currentColor;
    transition: color 0.6s ease, text-shadow 0.6s ease;
    white-space: nowrap;
    position: relative;
  }

  #headline.glitch {
    animation: glitch 0.25s steps(2, end) 2;
  }

  @keyframes glitch {
    0% { transform: translate(0); }
    20% { transform: translate(-2px, 1px); }
    40% { transform: translate(2px, -1px); }
    60% { transform: translate(-1px, 2px); text-shadow: 2px 0 #f4a8c7, -2px 0 #a8e6b0; }
    80% { transform: translate(1px, -2px); }
    100% { transform: translate(0); text-shadow: 0 0 18px currentColor; }
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 260px;
  }

  .btn {
    display: block;
    width: 100%;
    padding: 14px 0;
    border: 1.5px solid rgba(255,255,255,0.7);
    background: rgba(255,255,255,0.02);
    color: #fff;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.95rem;
    letter-spacing: 0.12em;
    text-align: center;
    text-decoration: none;
    text-transform: lowercase;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: color 0.25s ease, border-color 0.25s ease, letter-spacing 0.25s ease, box-shadow 0.25s ease;
    border-radius: 0;
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(120,160,255,0.35), transparent);
    transform: translateX(-100%);
    transition: transform 0.5s ease;
  }

  .btn:hover {
    color: #fff;
    border-color: #7aa0ff;
    letter-spacing: 0.18em;
    box-shadow: 0 0 16px rgba(120,160,255,0.35);
  }

  .btn:hover::before {
    transform: translateX(100%);
  }

  .btn span {
    position: relative;
    z-index: 1;
  }

  .footer-text {
    color: rgba(255,255,255,0.4);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    text-align: center;
    letter-spacing: 0.1em;
    line-height: 1.9;
  }

  .footer-text .dot {
    color: #7aa0ff;
    animation: blink 1.6s step-end infinite;
  }

  .cursor {
    display: inline-block;
    width: 2px;
    height: 1.1em;
    background: currentColor;
    margin-left: 3px;
    vertical-align: -0.1em;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
</style>
</head>
<body>

<div class="glow"></div>

<div class="container">
  <div class="text-block">
    <span id="headline">Hello. I'm ywsa-dev.<span class="cursor"></span></span>
  </div>

  <div class="buttons">
    <a class="btn" href="https://os-lang.com" target="_blank" rel="noopener"><span>os script</span></a>
    <a class="btn" href="https://ywsa-dev.github.io/OSBuilder" target="_blank" rel="noopener"><span>OSbuilder</span></a>
    <a class="btn" href="https://github.com/ywsa-dev/Ygame" target="_blank" rel="noopener"><span>Ygame</span></a>
    <a class="btn" href="https://github.com/ywsa-dev/codecraftX" target="_blank" rel="noopener"><span>Code craft X</span></a>
  </div>

  <div class="footer-text">
    html<span class="dot">.</span>github page
  </div>
</div>

<script>
  const lines = [
    { text: "Hello. I'm ywsa-dev.", color: "#ffffff" },
    { text: "Hello. I'm ywsa-dev.", color: "#ffffff" },
    { text: "I am 12 years old.", color: "#a8e6b0" },
    { text: "I am 12 years old.", color: "#a8e6b0" },
    { text: "I am 12 years old.", color: "#a8e6b0" },
    { text: "I am from Korea.", color: "#f4a8c7" },
    { text: "I am from Korea.", color: "#f4a8c7" },
    { text: "I am from Korea.", color: "#f4a8c7" },
  ];

  let idx = 0;
  const el = document.getElementById('headline');

  function update() {
    const line = lines[idx];
    el.classList.add('glitch');
    setTimeout(() => el.classList.remove('glitch'), 250);
    el.style.color = line.color;
    const cursor = el.querySelector('.cursor');
    cursor.style.background = line.color;
    el.childNodes[0].textContent = line.text;
    idx = (idx + 1) % lines.length;
  }

  setInterval(update, 1500);
</script>
</body>
</html>
